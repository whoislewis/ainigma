<style>

       padding:14px 18px 14px 14px;border-radius:18px;background:rgba(14,10,28,.58);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);

</div>

<script>
(() => {
'use strict';

/* ───────────── helpers ───────────── */
const TAU = Math.PI * 2, PI = Math.PI;
let _s = (Math.random() * 4294967296) >>> 0;
try { const q = new URLSearchParams(location.search).get('seed'); if (q) _s = (+q) >>> 0; } catch (e) {}
function rnd() { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a = 1, b) => b === undefined ? rnd() * a : a + rnd() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };

// value noise
const NP = new Uint8Array(512), NG = new Float32Array(256);
{ const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) NP[i] = p[i & 255]; for (let i = 0; i < 256; i++) NG[i] = rnd() * 2 - 1; }
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = NG[NP[(xi & 255) + NP[yi & 255]]], b = NG[NP[((xi + 1) & 255) + NP[yi & 255]]];
  const c = NG[NP[(xi & 255) + NP[(yi + 1) & 255]]], d = NG[NP[((xi + 1) & 255) + NP[(yi + 1) & 255]]];
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

/* ───────────── palettes ───────────── */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PALETTES = [
  { name: 'Meadow', top: hex('#cdb1cb'), bot: hex('#84b4ad'), stem: [135, 42, 38], moss: [[152, 46, 62], [128, 46, 40]], sw: 'linear-gradient(135deg,#cdb1cb,#7fbf9f 55%,#f0907e)',
    hues: [[8, 86, 70], [345, 82, 72], [272, 56, 68], [300, 48, 56], [38, 95, 62], [200, 55, 66]], pin: [[8, 90, 66], [38, 96, 60], [345, 86, 68]] },
  { name: 'Mist', top: hex('#8b989f'), bot: hex('#ccd3d3'), stem: [250, 10, 42], moss: [[268, 42, 70], [18, 62, 72]], sw: 'linear-gradient(135deg,#aeb9bd,#b48fd6 55%,#f2a25c)',
    hues: [[270, 50, 66], [290, 58, 38], [18, 68, 70], [222, 10, 58], [195, 78, 34], [330, 60, 62], [262, 44, 74]], pin: [[42, 96, 58], [330, 88, 62], [22, 95, 62]] },
  { name: 'Lilac', top: hex('#9a82d4'), bot: hex('#baa6e2'), stem: [96, 56, 44], moss: [[92, 58, 48], [140, 46, 36]], sw: 'linear-gradient(135deg,#a48fdc,#8fc04a 55%,#f7b08e)',
    hues: [[22, 92, 74], [350, 82, 72], [276, 60, 62], [256, 46, 70], [36, 82, 88], [310, 55, 70]], pin: [[22, 92, 70], [276, 62, 66], [50, 90, 70]] },
  { name: 'Reef', top: hex('#1a1440'), bot: hex('#5c4aa6'), stem: [172, 42, 34], moss: [[170, 48, 38], [285, 42, 42]], sw: 'linear-gradient(135deg,#2a2060,#e0408f 55%,#4fc3e0)',
    hues: [[322, 86, 52], [340, 92, 66], [8, 88, 62], [174, 66, 44], [196, 80, 64], [274, 64, 60], [350, 60, 84]], pin: [[196, 86, 70], [340, 92, 68], [174, 70, 60]] },
  { name: 'Glass', top: hex('#e4541c'), bot: hex('#f6a552'), stem: [216, 82, 44], moss: [[214, 72, 46], [232, 62, 32]], sw: 'linear-gradient(135deg,#ee6a26,#f6a552 45%,#2a5fe0)',
    hues: [[218, 90, 50], [202, 88, 62], [205, 70, 88], [250, 72, 62], [228, 84, 34], [190, 80, 70]], pin: [[205, 70, 92], [202, 90, 66], [250, 76, 70]] },
  { name: 'Emerald', top: hex('#06211a'), bot: hex('#2a6b4c'), stem: [140, 62, 30], moss: [[128, 60, 32], [88, 66, 44]], sw: 'linear-gradient(135deg,#0b3326,#3f9a5c 55%,#e3e04a)',
    hues: [[88, 72, 52], [152, 64, 36], [52, 96, 60], [70, 40, 92], [350, 82, 52], [165, 55, 55]], pin: [[52, 96, 62], [70, 40, 94], [350, 84, 60]] },
  { name: 'Ink', top: hex('#07090f'), bot: hex('#1b2130'), stem: [38, 34, 74], moss: [[190, 34, 62], [38, 44, 72]], sw: 'linear-gradient(135deg,#0b0e17,#9fd6d0 55%,#f0c98a)',
    hues: [[188, 48, 74], [38, 62, 80], [326, 52, 72], [158, 40, 64], [262, 40, 78], [26, 82, 66]], pin: [[42, 92, 72], [188, 72, 74], [330, 82, 72]] },
  { name: 'Tide', top: hex('#0e3a48'), bot: hex('#84c1b7'), stem: [176, 34, 38], moss: [[172, 40, 50], [20, 58, 70]], sw: 'linear-gradient(135deg,#0e3a48,#84c1b7 50%,#f39a8a)',
    hues: [[352, 72, 72], [26, 84, 72], [184, 56, 80], [44, 78, 82], [300, 40, 72], [170, 50, 42]], pin: [[44, 92, 76], [352, 82, 70], [184, 72, 82]] },
];
let pIdx = 0, drift = false, driftT = 0;
let bgTop = PALETTES[0].top.slice(), bgBot = PALETTES[0].bot.slice(), hazeL = 60, SH = '12,6,30';
let palVer = 0;
const PREF = [[0, 2], [0, 2], [0, 2], [0, 3], [0, 1], [0, 2], [0, 1], [0, 1]];
function rollAct(P, pref) { if (pref) { P.act = pref.slice(); return; } const h = P.hues.map((_, i) => i); P.act = []; for (let i = 0; i < 2; i++) P.act.push(h.splice(Math.floor(rnd() * h.length), 1)[0]); }
PALETTES.forEach((P, i) => rollAct(P, PREF[i]));

const soft = c => [c[0], c[1] * .86, c[2]];
// restrained: one main colour per organism, a lighter tint of it, and now and then the second colour
function palette() {

  const p = [m, rnd() < .75 ? [m[0] + R(-10, 10), m[1], Math.min(92, m[2] + 12)] : o];
  p.stem = P.stem; p.moss = P.moss; p.pin = P.pin; return p;
}
function mixc(a, b, t) { const dh = ((b[0] - a[0] + 540) % 360) - 180; return [(a[0] + dh * t + 360) % 360, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
const jit = (c, dh = 10, dl = 6) => [(c[0] + R(-dh, dh) + 360) % 360, c[1], clamp(c[2] + R(-dl, dl), 4, 96)];

/* ───────────── canvases ───────────── */
const $ = id => document.getElementById(id);
const stage = $('stage');
let W = 1, H = 1, U = 1, DPR = 1, DIL = 20;
const SPAN = 3200;
const LAYERS = [
  { name: 'far',   res: .6,  k: 1.05, hz: .75, blur: 2.8,   par: -3,  er: .5 },
  { name: 'mid',   res: .8,  k: .9,   hz: .3,  blur: .5, par: -6,  er: .45 },
  { name: 'front', res: 1,   k: 1.1,  hz: 0,   blur: 0,   par: -10, er: .4 },
  { name: 'near',  res: .4,  k: 2.4,  hz: 0,   blur: 8,  par: -30, er: 1.1 },
];
for (const l of LAYERS) { l.cv = $(l.name); l.ctx = l.cv.getContext('2d'); l.av = document.createElement('canvas'); l.actx = l.av.getContext('2d'); l.acc = 0; l.occ = new Float32Array(48); l.ag = new Float32Array(48 * 27); l.pen = { ctx: l.ctx, k: l.k, hz: l.hz, u: 1, layer: l }; }
const bgCv = $('bg'), bgCtx = bgCv.getContext('2d');
const fxCv = $('fx'), fx = fxCv.getContext('2d');
let fxK = 1;

function sizeCanvas(cv, ctx, w, h, keep) {
  if (cv.width === w && cv.height === h) return;
  let tmp = null;
  if (keep && cv.width > 1) { tmp = document.createElement('canvas'); tmp.width = cv.width; tmp.height = cv.height; tmp.getContext('2d').drawImage(cv, 0, 0); }
  cv.width = w; cv.height = h;
  if (tmp) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(tmp, Math.round((w - tmp.width) / 2), h - tmp.height); }
}
function resize() {
  const oW = W, oH = H;
  W = Math.max(1, stage.clientWidth || innerWidth); H = Math.max(1, stage.clientHeight || innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const maxPx = 2560 * 1440; if (W * H * DPR * DPR > maxPx) DPR = Math.sqrt(maxPx / (W * H));
  U = Math.sqrt(W * H) / 1150; DIL = 5 * U;
  for (const l of LAYERS) {
    const k = DPR * l.res;
    sizeCanvas(l.cv, l.ctx, Math.round(W * k), Math.round(H * k), true);
    l.ctx.setTransform(l.cv.width / W, 0, 0, l.cv.height / H, 0, 0);
    l.ctx.lineCap = 'round'; l.ctx.lineJoin = 'round';
    l.pen.u = U * l.k;
    { const ak = Math.min(DPR, 1) * .5; sizeCanvas(l.av, l.actx, Math.round(W * ak), Math.round(H * ak), true); l.actx.setTransform(l.av.width / W, 0, 0, l.av.height / H, 0, 0); l.actx.lineCap = 'round'; l.actx.lineJoin = 'round'; }
    l.cv.style.filter = l.blur ? `blur(${(l.blur * U).toFixed(1)}px)` : 'none'; l.d = 1;
  }
  sizeCanvas(bgCv, bgCtx, Math.max(2, Math.round(W / 4)), Math.max(2, Math.round(H / 4)), false);
  if (oW > 1) try { drawBg(0); } catch (e) {}      // resizing clears the background canvas: paint it again at once, so no black frame shows
  fxK = Math.min(DPR, 1.5);
  sizeCanvas(fxCv, fx, Math.round(W * fxK), Math.round(H * fxK), false);
  fx.setTransform(fxCv.width / W, 0, 0, fxCv.height / H, 0, 0);
  if (oW > 1 && (oW !== W || oH !== H)) onResized((W - oW) / 2, H - oH);
}
addEventListener('resize', resize);
document.addEventListener('fullscreenchange', resize);

/* ───────────── colour + primitives ───────────── */
const LA = -2.25;                    // light comes from upper left
function col(pen, c, dl = 0, a = 1, ds = 0) {
  let s = clamp(c[1] + ds, 0, 100), l = clamp(c[2] + dl, 4, 97);

  const d = clamp(raw / 1000, .001, .05);
  if (spd < 1) step(d * spd, d);
  else { spdAcc += spd; const n = Math.floor(spdAcc); spdAcc -= n; window.__noDraw = true; if (spd >= 8) FF = 1; try { for (let i = 1; i < n; i++) step(d, 0); } finally { if (FF) batAll(); FF = 0; window.__noDraw = false; } step(d); }      // 8x: the steps in between use the coarser fast-forward drawing      // faster: extra garden steps without drawing in between
  requestAnimationFrame(frame);
}
